<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">

<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="8" cy="8" r="1.1" fill="rgba(26,23,20,0.12)" />
  </pattern>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    .font-anton { font-family: 'Anton', Impact, sans-serif; }
    .font-cond { font-family: 'Barlow Condensed', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-sans { font-family: 'Inter', sans-serif; }
  </style>
</defs>

  <rect width="800" height="500" fill="#f5efe6" />
  <rect width="800" height="500" fill="url(#dots)" />

  <g transform="translate(0, 0)">
    
    <!-- Hard shadow -->
    <rect x="56" y="41" width="700" height="410" rx="14" fill="#1a1714" />
    <!-- Window Body Base -->
    <rect x="50" y="35" width="700" height="410" rx="14" fill="#fffaf2" stroke="#1a1714" stroke-width="2.5" />
    <!-- Window Bar -->
    <path d="M 50 35 L 750 35 L 750 78 L 50 78 Z" fill="#ebe2d4" stroke="#1a1714" stroke-width="2.5" />
    <circle cx="75" cy="56" r="6" fill="#c8532f" stroke="#1a1714" stroke-width="1.2" />
    <circle cx="94" cy="56" r="6" fill="#e9a62a" stroke="#1a1714" stroke-width="1.2" />
    <circle cx="113" cy="56" r="6" fill="#2e6e66" stroke="#1a1714" stroke-width="1.2" />
    <!-- Address Pill -->
    <rect x="145" y="45" width="580" height="23" rx="11.5" fill="#fffaf2" stroke="#1a1714" stroke-width="1.2" />
    <text x="435" y="61" text-anchor="middle" class="font-mono" font-size="11" fill="#6b6259" font-weight="500">planmyjourney.app / itinerary / tokyo-kyoto</text>
    

    <text x="80" y="112" class="font-sans" font-size="17" font-weight="700" fill="#1a1714">Trip: Tokyo &amp; Kyoto</text>
    <text x="80" y="130" class="font-mono" font-size="11" fill="#6b6259">7-Day Flexible Travel Logistics &amp; Route Guide</text>
    
    <rect x="615" y="98" width="105" height="24" rx="12" fill="#fae8e2" stroke="#c8532f" stroke-width="1.5" />
    <text x="667.5" y="114" text-anchor="middle" class="font-cond" font-size="11" font-weight="800" fill="#c8532f" letter-spacing="1">ON SCHEDULE</text>

    <!-- Main Trip Card -->
    <rect x="80" y="148" width="640" height="114" rx="10" fill="#f5efe6" stroke="#1a1714" stroke-width="1.8" />
    <text x="104" y="176" class="font-mono" font-size="10.5" font-weight="600" fill="#6b6259" letter-spacing="1.2">TOTAL ITINERARY DAYS</text>
    <text x="104" y="218" class="font-anton" font-size="44" fill="#1a1714">7 DAYS</text>
    <text x="104" y="244" class="font-mono" font-size="11.5" font-weight="600" fill="#2e6e66">✓ 14 Attractions Booked &amp; Synced</text>

    <!-- Ring Gauge -->
    <g transform="translate(650, 205)">
      <circle cx="0" cy="0" r="34" fill="none" stroke="#e6ded0" stroke-width="7" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="#c8532f" stroke-width="7" stroke-dasharray="213" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90)" />
      <circle cx="0" cy="0" r="6" fill="#c8532f" />
    </g>

    <!-- Itinerary Days Timeline -->
    <text x="80" y="286" class="font-mono" font-size="10.5" font-weight="700" fill="#6b6259" letter-spacing="1.5">MULTI-STOP LOGISTICS ROUTE</text>
    
    <!-- Day 1 Card -->
    <rect x="80" y="302" width="200" height="58" rx="8" fill="#fffaf2" stroke="#c8532f" stroke-width="1.5" />
    <text x="96" y="324" class="font-mono" font-size="11" font-weight="700" fill="#c8532f">DAY 01 · TOKYO</text>
    <text x="96" y="344" class="font-sans" font-size="11" fill="#6b6259">Shinkansen Express · 10:30</text>

    <!-- Day 2 Card -->
    <rect x="295" y="302" width="200" height="58" rx="8" fill="#fffaf2" stroke="#e9a62a" stroke-width="1.5" />
    <text x="311" y="324" class="font-mono" font-size="11" font-weight="700" fill="#e9a62a">DAY 02 · KYOTO</text>
    <text x="311" y="344" class="font-sans" font-size="11" fill="#6b6259">Fushimi Inari Shrine · 09:00</text>

    <!-- Day 3 Card -->
    <rect x="510" y="302" width="210" height="58" rx="8" fill="#fffaf2" stroke="#2e6e66" stroke-width="1.5" />
    <text x="526" y="324" class="font-mono" font-size="11" font-weight="700" fill="#2e6e66">DAY 03 · NARA</text>
    <text x="526" y="344" class="font-sans" font-size="11" fill="#6b6259">Historic Park Route Sync</text>

    <!-- Bottom summary line -->
    <rect x="80" y="380" width="640" height="38" rx="8" fill="#f5efe6" stroke="#1a1714" stroke-width="1.5" />
    <text x="104" y="404" class="font-mono" font-size="11" fill="#1a1714">Budget Optimization: 78% utilized · Live offline mapping enabled</text>
  </g>

  <!-- Bottom Right Tilted Sticker -->
  <g transform="translate(635, 385) rotate(-4)">
    <rect x="4" y="4" width="135" height="66" rx="10" fill="#1a1714" />
    <rect x="0" y="0" width="135" height="66" rx="10" fill="#ffffff" stroke="#1a1714" stroke-width="2.5" />
    <text x="67.5" y="36" text-anchor="middle" class="font-anton" font-size="34" fill="#c8532f">7 DAYS</text>
    <text x="67.5" y="54" text-anchor="middle" class="font-cond" font-size="12.5" font-weight="800" fill="#1a1714" letter-spacing="1">ROUTE SYNCED</text>
  </g>
</svg>